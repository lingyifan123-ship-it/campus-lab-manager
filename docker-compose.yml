services:
  mysql:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: lab_manager, MYSQL_USER: lab, MYSQL_PASSWORD: lab123, MYSQL_ROOT_PASSWORD: root123}
    ports: ["3307:3306"]
    volumes: ["lab-mysql:/var/lib/mysql"]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost","-proot123"], interval: 5s, timeout: 3s, retries: 20}
  app:
    build: .
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lab_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: lab
      DB_PASSWORD: lab123
    depends_on: {mysql: {condition: service_healthy}}
volumes: {lab-mysql: {}}
